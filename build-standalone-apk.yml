name: Build Standalone APK (NFC Android, sans backend)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "native-android/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-standalone-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer Capacitor
        run: npm ci

      - name: Tests de préparation
        run: npm test

      - name: Préparer la page autonome
        run: npm run prepare:web

      - name: Add Android platform
        run: npx cap add android

      - name: Intégrer le module NFC Android local
        run: npm run android:prepare

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChemicalStockManager-Standalone-NFC-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
